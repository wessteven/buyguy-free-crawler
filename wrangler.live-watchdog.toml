name = "goget-live-source-watchdog"
main = "src/goget-live-source-watchdog-worker.mjs"
compatibility_date = "2026-10-18"
workers_dev = true
[[d1_databases]]
binding = "DB"
database_name = "buyguy-free-v3"
database_id = "REPLACE_WITH_YOUR_OWN_D1_DATABASE_ID"
[triggers]
crons = ["*/5 * * * *"]
[limits]
cpu_ms = 2000
[vars]
WATCHDOG_ENABLED = "true"
WATCHDOG_STOP_AT = "2026-11-08T00:00:00Z"
