name = "vlad-public-wallet-collector"
main = "src/worker.mjs"
compatibility_date = "2026-10-20"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "buyguy-free-v3"
database_id = "REPLACE_WITH_YOUR_OWN_D1_DATABASE_ID"

[triggers]
crons = ["*/10 * * * *"]

[vars]
VLAD_WATCH_MODE = "READ_ONLY_PUBLIC_EVIDENCE"
VLAD_WATCH_VERSION = "0.1.0"