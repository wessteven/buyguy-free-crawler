name: GOGET Cloudflare Six-Agent Runtime — deploy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-goget-cloudflare-agents.yml'
      - 'src/goget-cloudflare-agent-worker.mjs'
      - 'src/goget-six-agent-harness.mjs'
      - 'src/goget-six-agent-batching.mjs'
      - 'wrangler.six-agent.toml'
      - 'sql/goget-six-agent-worker.sql'
      - 'tests/goget-cloudflare-agent-worker.test.mjs'
      - 'scripts/verify-goget-cloudflare-agents.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goget-cloudflare-six-agent-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate worker safety and all GOGET JS regressions
        run: |
          node --check src/goget-cloudflare-agent-worker.mjs
          node --check scripts/verify-goget-cloudflare-agents.mjs
          node --test tests/*.test.mjs
      - name: Install existing Wrangler dependency
        run: npm install --no-audit --no-fund
      - name: Bind pre-existing D1 database ID without committing it
        env:
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          ident=os.environ.get('CF_DATABASE_ID','')
          if len(ident)<16:raise SystemExit('EXISTING_D1_ID_MISSING')
          p=Path('wrangler.six-agent.toml')
          p.write_text(p.read_text().replace('REPLACE_WITH_YOUR_OWN_D1_DATABASE_ID',ident))
          PY
      - name: Apply additive idempotent D1 research tables
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: |
          python - <<'PY'
          import json,os
          from urllib.request import Request,urlopen
          from pathlib import Path
          account,database,token=[os.environ[x] for x in ('CF_ACCOUNT_ID','CF_DATABASE_ID','CF_D1_API_TOKEN')]
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{database}/query'
          stmts=[x.strip() for x in Path('sql/goget-six-agent-worker.sql').read_text().split(';') if x.strip()]
          for sql in stmts:
            req=Request(url,data=json.dumps({'sql':sql,'params':[]}).encode(),method='POST',
              headers={'authorization':'Bearer '+token,'content-type':'application/json'})
            with urlopen(req,timeout=25) as r: body=json.load(r)
            if body.get('success') is not True or body.get('result',[{}])[0].get('success') is not True:
              raise SystemExit('AGENT_D1_SCHEMA_REJECTED')
          print('GOGET_AGENT_D1_SCHEMA_OK',len(stmts))
          PY
      - name: Deploy isolated five-minute Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.six-agent.toml
      - name: Install purpose-separated protected trigger secret
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node -e 'const {createHmac}=require("node:crypto");const s=process.env.ADMIN_TOKEN;if(!s||s.length<24)process.exit(1);process.stdout.write(createHmac("sha256",s).update("GOGET:SIX_AGENT:MANUAL_RUN:v1").digest("base64url"))' | npx wrangler secret put AGENT_CONTROL_TOKEN --config wrangler.six-agent.toml
      - name: Verify remote Worker with one bounded research cycle
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: node scripts/verify-goget-cloudflare-agents.mjs
