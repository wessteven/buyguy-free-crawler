name: GOGET Wallet Quality Audit (D1 read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goget-wallet-quality-audit.yml'
      - 'scripts/goget-wallet-quality-audit.mjs'
      - 'src/goget-wallet-quality.mjs'
      - 'tests/goget-wallet-quality.test.mjs'
  schedule:
    - cron: '37 0,6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goget-wallet-quality-read-only
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check bounded audit source and wallet quality regressions
        run: |
          node --check scripts/goget-wallet-quality-audit.mjs
          node --check src/goget-wallet-quality.mjs
          node --test tests/goget-wallet-quality.test.mjs
      - name: Read-only D1 wallet contribution and outcome coverage audit
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: node scripts/goget-wallet-quality-audit.mjs
      - name: Save audit evidence separately from scanner and trading data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goget-wallet-quality-read-only
          path: goget-wallet-quality-report.json
          retention-days: 7
          if-no-files-found: warn
