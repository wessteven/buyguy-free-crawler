name: Populate BuyGuy Social Links
on:
  push:
    paths:
      - '.github/workflows/social-backfill.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify social URL parsing and complete table tests
        run: node --test tests/social-links.test.mjs tests/viewer-table.test.mjs
      - name: Enrich existing token contracts with public metadata, no API trading
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: node src/backfill-socials.mjs
