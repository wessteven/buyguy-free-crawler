name: Vlad watch independent D1 coverage audit
on:
  push:
    branches: [main]
    paths:
      - 'vladwatch/audit_live.py'
      - '.github/workflows/audit-vlad-wallet.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: vlad-independent-coverage-audit
  cancel-in-progress: false
jobs:
  verify-all-five:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Query Cloudflare D1 independently and ENFORCE complete coverage
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: python vladwatch/audit_live.py