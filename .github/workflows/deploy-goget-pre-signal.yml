name: GOGET Prospective Pre-Signal — Cloudflare deploy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-goget-pre-signal.yml'
      - 'src/goget-pre-signal-features.mjs'
      - 'src/goget-pre-signal-worker.mjs'
      - 'tests/goget-pre-signal-features.test.mjs'
      - 'tests/goget-pre-signal-worker.test.mjs'
      - 'wrangler.pre-signal.toml'
      - 'sql/goget-pre-signal.sql'
      - 'scripts/verify-goget-pre-signal.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goget-pre-signal-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full GOGET JavaScript tests and signal source checks
        run: |
          node --check src/goget-pre-signal-features.mjs
          node --check src/goget-pre-signal-worker.mjs
          node --check scripts/verify-goget-pre-signal.mjs
          node --test tests/*.test.mjs
      - name: Install existing Wrangler dependency
        run: npm install --no-audit --no-fund
      - name: Replace D1 placeholder only during deployment
        env:
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          ident=os.environ.get('CF_DATABASE_ID','')
          if len(ident)<16:raise SystemExit('D1_DATABASE_ID_MISSING')
          p=Path('wrangler.pre-signal.toml')
          p.write_text(p.read_text().replace('REPLACE_WITH_YOUR_OWN_D1_DATABASE_ID',ident))
          PY
      - name: Apply additive pre-signal research schema
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from urllib.request import Request,urlopen
          a,d,t=[os.environ[k] for k in ('CF_ACCOUNT_ID','CF_DATABASE_ID','CF_D1_API_TOKEN')]
          url=f'https://api.cloudflare.com/client/v4/accounts/{a}/d1/database/{d}/query'
          statements=[s.strip() for s in Path('sql/goget-pre-signal.sql').read_text().split(';') if s.strip()]
          for sql in statements:
            req=Request(url,method='POST',data=json.dumps({'sql':sql,'params':[]}).encode(),
              headers={'authorization':'Bearer '+t,'content-type':'application/json'})
            with urlopen(req,timeout=25) as r:answer=json.load(r)
            if answer.get('success') is not True or answer.get('result',[{}])[0].get('success') is not True:
              raise SystemExit('GOGET_PRE_SIGNAL_SCHEMA_ERROR')
          print('GOGET_PRE_SIGNAL_SCHEMA_OK',len(statements))
          PY
      - name: Deploy isolated research-only Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.pre-signal.toml
      - name: Install private purpose-separated control secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          node -e 'const {createHmac}=require("node:crypto");const s=process.env.ADMIN_TOKEN;if(!s||s.length<24)process.exit(1);process.stdout.write(createHmac("sha256",s).update("GOGET:PRE_SIGNAL:RUN:v1").digest("base64url"))' | npx wrangler secret put PRE_SIGNAL_CONTROL_TOKEN --config wrangler.pre-signal.toml
      - name: Prove first real prospective feature window
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: node scripts/verify-goget-pre-signal.mjs
