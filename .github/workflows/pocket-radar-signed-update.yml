name: Pocket Radar Signed Update APK

# A single persistent signing identity permits update-in-place once its first
# release APK has been installed. Release keys NEVER go in the repository.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/pocket-radar-android
    paths:
      - 'android/pocket-radar/**'
      - '.github/workflows/pocket-radar-signed-update.yml'

permissions:
  contents: read

jobs:
  signed-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check for stable signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.POCKET_RADAR_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.POCKET_RADAR_SIGNING_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE" && -n "$PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Stable signing is configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signed APK not built. Add both POCKET_RADAR_KEYSTORE_BASE64 and POCKET_RADAR_SIGNING_PASSWORD in Settings > Secrets and variables > Actions."
          fi
      - name: Configure Android SDK
        if: steps.signing.outputs.ready == 'true'
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          gradle-version: '8.9'
      - name: Restore signing key to private runner temp file
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          KEYSTORE: ${{ secrets.POCKET_RADAR_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.POCKET_RADAR_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/pocket-radar-release.p12"
          test -s "$RUNNER_TEMP/pocket-radar-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/pocket-radar-release.p12" -alias pocket-radar -storepass "$SIGNING_PASSWORD" >/dev/null
      - name: Run tests and build stably signed release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: android/pocket-radar
        env:
          POCKET_RADAR_KEYSTORE_PATH: ${{ runner.temp }}/pocket-radar-release.p12
          POCKET_RADAR_SIGNING_PASSWORD: ${{ secrets.POCKET_RADAR_SIGNING_PASSWORD }}
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify signed APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: android/pocket-radar
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | head -n 1
      - name: Upload signed INSTALLABLE UPDATE
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pocket-radar-v07-SIGNED-UPDATE
          path: android/pocket-radar/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove private key file from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/pocket-radar-release.p12"
