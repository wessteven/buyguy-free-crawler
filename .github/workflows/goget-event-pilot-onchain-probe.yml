name: GOGET pilot on-chain pool identity feasibility — read only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goget-event-pilot-onchain-probe.yml'
      - 'scripts/goget-event-pilot-onchain-probe.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify at most 30 pool identities in one public RPC call and no Helius usage
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: |
          node --check scripts/goget-event-pilot-onchain-probe.mjs
          node scripts/goget-event-pilot-onchain-probe.mjs
