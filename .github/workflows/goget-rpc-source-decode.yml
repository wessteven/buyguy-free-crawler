name: GOGET Helius Three-Wallet RPC Decode — forward-safe retrospective enrichment
on:
  pull_request:
    paths:
      - '.github/workflows/goget-rpc-source-decode.yml'
      - 'src/goget-rpc-decoding.mjs'
      - 'tests/goget-rpc-decoding.test.mjs'
      - 'scripts/goget-rpc-source-decode.mjs'
      - 'sql/goget-rpc-decoding.sql'
  push:
    branches: [main]
    paths:
      - '.github/workflows/goget-rpc-source-decode.yml'
      - 'src/goget-rpc-decoding.mjs'
      - 'tests/goget-rpc-decoding.test.mjs'
      - 'scripts/goget-rpc-source-decode.mjs'
      - 'sql/goget-rpc-decoding.sql'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goget-three-wallet-helius-decoding-shared-rpc-credit-gate
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify all original and new JavaScript regressions
        run: |
          node --check src/goget-rpc-decoding.mjs
          node --check scripts/goget-rpc-source-decode.mjs
          node --test tests/*.test.mjs
      - name: Check isolated decoding schema idempotence
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3
          sql=Path('sql/goget-rpc-decoding.sql').read_text()
          db=sqlite3.connect(':memory:')
          db.executescript(sql)
          db.executescript(sql)
          names={x[0] for x in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required={'goget_rpc_decode_budget','goget_rpc_decoded_signatures',
                    'goget_rpc_decode_attempts','goget_rpc_decode_runs'}
          assert required<=names
          assert names==required
          print('GOGET_RPC_DECODE_FOUR_TABLES_ISOLATED_AND_IDEMPOTENT')
          PY
  decode:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Stop at original source pilot cutoff without spending provider credits
        id: stop
        run: |
          if [ "$(date -u +%s)" -ge "1794096000" ]; then
            echo 'go=false' >> "$GITHUB_OUTPUT"
            echo 'GOGET_DECODE_PILOT_EXPIRED_2026_11_08_NO_CALLS'
          else
            echo 'go=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install exactly four isolated D1 tables and one index
        if: steps.stop.outputs.go == 'true'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          from urllib.request import Request,urlopen
          account,db,token=[os.environ[k] for k in ('CF_ACCOUNT_ID','CF_DATABASE_ID','CF_D1_API_TOKEN')]
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/query'
          text='\n'.join(x for x in Path('sql/goget-rpc-decoding.sql').read_text().splitlines()
           if not x.strip().startswith('--'))
          statements=[x.strip() for x in text.split(';') if x.strip()]
          if len(statements)!=5:raise SystemExit('DECODE_SCHEMA_SCOPE_UNVERIFIED')
          for stmt in statements:
            if not stmt.startswith(('CREATE TABLE IF NOT EXISTS goget_rpc_decode_',
              'CREATE TABLE IF NOT EXISTS goget_rpc_decoded_',
              'CREATE INDEX IF NOT EXISTS goget_rpc_decode_')):
              raise SystemExit('DECODE_SCHEMA_FOREIGN_MUTATION_FORBIDDEN')
            req=Request(url,data=json.dumps({'sql':stmt,'params':[]}).encode(),
             headers={'authorization':'Bearer '+token,'content-type':'application/json'},method='POST')
            with urlopen(req,timeout=19) as r:v=json.load(r)
            if v.get('success') is not True or v.get('result',[{}])[0].get('success') is not True:
              raise SystemExit('DECODE_SCHEMA_RESULT_UNVERIFIED')
          print('GOGET_RPC_DECODE_SCHEMA_CREATED_ISOLATED_5_STATEMENTS')
          PY
      - name: Up to one Helius archival transaction per original wallet, strict local reservation
        if: steps.stop.outputs.go == 'true'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node scripts/goget-rpc-source-decode.mjs
      - name: Retain precise source and budget evidence including incomplete runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goget-three-wallet-rpc-decode-evidence
          path: goget-rpc-decoder-report.json
          retention-days: 30
          if-no-files-found: warn
