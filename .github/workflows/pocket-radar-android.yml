name: Pocket Radar Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/pocket-radar/**'
      - '.github/workflows/pocket-radar-android.yml'
  pull_request:
    paths:
      - 'android/pocket-radar/**'
      - '.github/workflows/pocket-radar-android.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run parser regression tests
        working-directory: android/pocket-radar
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Assemble debug APK
        working-directory: android/pocket-radar
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-radar-v06-debug-apk
          path: android/pocket-radar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
