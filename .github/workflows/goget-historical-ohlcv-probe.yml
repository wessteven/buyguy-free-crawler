name: GOGET Historical OHLCV Recovery Probe (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goget-historical-ohlcv-probe.yml'
      - 'scripts/goget-historical-ohlcv-probe.mjs'
      - 'src/goget-historical-ohlcv.mjs'
      - 'tests/goget-historical-ohlcv.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goget-historical-price-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert historical price provenance and strict no-lookahead matching
        run: |
          node --check scripts/goget-historical-ohlcv-probe.mjs
          node --test tests/goget-historical-ohlcv.test.mjs
      - name: Probe five exact historical pools without any Helius or D1 mutations
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: node scripts/goget-historical-ohlcv-probe.mjs
      - name: Store limited historical provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goget-ohlcv-recovery-probe
          path: goget-ohlcv-recovery-probe.json
          retention-days: 14
          if-no-files-found: warn
