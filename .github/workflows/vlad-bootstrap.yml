name: Vlad wallet one-shot live bootstrap (no trading)
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/vlad-once.mjs'
      - '.github/workflows/vlad-bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vlad-one-shot-bootstrap
  cancel-in-progress: true
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check bounded standalone bootstrap syntax
        run: node --check .github/scripts/vlad-once.mjs
      - name: Run same collector once with namespaced Cloudflare D1 REST adapter
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: node .github/scripts/vlad-once.mjs