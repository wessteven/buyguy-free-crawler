name: Helius direct pool live trial
on:
  push:
    paths: ['src/helius-fast-quotes.mjs', 'scripts/helius-fast-trial.mjs', '.github/workflows/helius-fast-trial.yml', 'tests/helius-fast-quotes.test.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - name: Four live confirmed-slot snapshots
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: node scripts/helius-fast-trial.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helius-fast-proof
          path: helius-fast-trial.jsonl
  soak:
    needs: proof
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One-hour direct-chain soak
        env:
          TRIAL_CYCLES: '121'
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: node scripts/helius-fast-trial.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helius-fast-one-hour-soak
          path: helius-fast-trial.jsonl
