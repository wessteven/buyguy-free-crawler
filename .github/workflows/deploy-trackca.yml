name: trackCA independent tracker — test and deploy
on:
  push:
    branches: [main, feature/trackca-independent]
    paths:
      - 'trackca/**'
      - '.github/workflows/deploy-trackca.yml'
  pull_request:
    paths:
      - 'trackca/**'
      - '.github/workflows/deploy-trackca.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trackca-independent-deploy
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and regression tests
        run: |
          node --check trackca/src/worker.mjs
          node --check trackca/src/watchlist.mjs
          node --check trackca/src/normalize.mjs
          node --test trackca/tests/*.test.mjs
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          sql=Path('trackca/sql/001_trackca.sql').read_text()
          c=sqlite3.connect(':memory:')
          c.executescript(sql)
          c.executescript(sql)
          print('TRACKCA_ADDITIVE_SCHEMA_OK')
          PY
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Inject existing D1 binding, trackCA config only
        env:
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          ident=os.environ.get('CF_DATABASE_ID','')
          if len(ident)<16:raise SystemExit('TRACKCA_D1_ID_MISSING')
          p=Path('trackca/wrangler.toml')
          p.write_text(p.read_text().replace('REPLACE_WITH_YOUR_OWN_D1_DATABASE_ID',ident))
          PY
      - name: Apply additive trackCA-only schema
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from urllib.request import Request,urlopen
          account,database,token=[os.environ.get(k,'') for k in ('CF_ACCOUNT_ID','CF_DATABASE_ID','CF_D1_API_TOKEN')]
          if not all((account,database,token)):raise SystemExit('TRACKCA_D1_CREDENTIALS_MISSING')
          content='\n'.join(s for s in Path('trackca/sql/001_trackca.sql').read_text().splitlines() if not s.lstrip().startswith('--'))
          statements=[s.strip() for s in content.split(';') if s.strip()]
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{database}/query'
          for stmt in statements:
            if not stmt.upper().startswith(('CREATE TABLE IF NOT EXISTS TRACKCA_','CREATE INDEX IF NOT EXISTS IX_TRACKCA_')):
              raise SystemExit('TRACKCA_NOT_ADDITIVE')
            data=json.dumps({'sql':stmt,'params':[]}).encode()
            req=Request(url,data=data,method='POST',headers={'authorization':'Bearer '+token,'content-type':'application/json'})
            with urlopen(req,timeout=25) as r: body=json.load(r)
            if body.get('success') is not True or body.get('result',[{}])[0].get('success') is not True:
              raise SystemExit('TRACKCA_SCHEMA_FAILED')
          print('TRACKCA_SCHEMA_OK',len(statements))
          PY
      - name: Deploy ONLY the separate trackca-collector Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --config trackca/wrangler.toml
      - name: Verify independent Worker health
        run: |
          python - <<'PY'
          import json,time,urllib.request
          url='https://trackca-collector.wessteven.workers.dev/health'
          for attempt in range(6):
            try:
              with urllib.request.urlopen(url,timeout=15) as r: obj=json.load(r)
              if obj.get('project')=='trackCA':
                print('TRACKCA_HEALTH_OK',obj.get('status'));break
            except Exception as e:
              from urllib.error import HTTPError
              if isinstance(e,HTTPError):
                print('retry',attempt+1,'HTTP',e.code,'reason',e.reason,'response',e.read(300).decode('utf-8','replace'))
              else:
                print('retry',attempt+1,type(e).__name__,str(e)[:160])
            time.sleep(10)
          else:raise SystemExit('TRACKCA_HEALTH_UNVERIFIED')
          PY
