name: GOGET Historical Native Swap Ratio (evidence only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goget-historical-native-ratio.yml'
      - 'scripts/goget-historical-native-ratio.mjs'
      - 'src/goget-historical-native-ratio.mjs'
      - 'sql/goget-historical-native-ratio.sql'
      - 'tests/goget-historical-native-ratio.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goget-historical-native-ratio
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test native transfer ratio provenance and ambiguity guards
        run: |
          node --check scripts/goget-historical-native-ratio.mjs
          node --test tests/goget-historical-native-ratio.test.mjs
      - name: Check exact identified Helius swaps, no USD inference
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node scripts/goget-historical-native-ratio.mjs
      - name: Save native forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goget-historical-native-ratio
          path: goget-historical-native-ratio.json
          retention-days: 21
          if-no-files-found: warn
