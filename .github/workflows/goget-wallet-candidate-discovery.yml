name: GOGET Candidate Wallet Discovery (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goget-wallet-candidate-discovery.yml'
      - 'scripts/goget-wallet-candidate-discovery.mjs'
  schedule:
    - cron: '12 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goget-candidate-wallet-discovery
  cancel-in-progress: false
jobs:
  discover:
    if: github.event_name != 'schedule' || github.event.schedule == '12 */6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover bounded active Solana signers and persist unvetted evidence in D1
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d '2026-11-08T00:00:00Z' +%s)" ]; then
            echo 'Discovery pilot expired; no further RPC calls'
            exit 0
          fi
          node scripts/goget-wallet-candidate-discovery.mjs
      - name: Preserve bounded non-trading candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goget-unvetted-wallet-candidates
          path: smart-wallet-candidate-cohort.json
          retention-days: 7
          if-no-files-found: warn
