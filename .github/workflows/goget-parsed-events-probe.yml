name: GOGET Parsed Events Signature Probe (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goget-parsed-events-probe.yml'
      - 'scripts/goget-parsed-events-probe.mjs'
      - 'tests/goget-parsed-events-probe.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify single source batch and no data writes
        run: |
          node --check scripts/goget-parsed-events-probe.mjs
          node --test tests/goget-parsed-events-probe.test.mjs
      - name: Inspect one Helius Parsed Events response shape
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node scripts/goget-parsed-events-probe.mjs
