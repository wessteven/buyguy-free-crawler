name: GOGET Wallet Webhook — deploy and time-boxed cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-smart-wallet-webhook.yml'
      - 'src/smart-wallet-webhook-worker.mjs'
      - 'tests/smart-wallet-webhook.test.mjs'
      - 'scripts/provision-smart-wallet-webhook.mjs'
      - 'wrangler.smart-wallet.toml'
      - 'sql/smart-wallet-webhook.sql'
      - 'research/smart-wallet-webhook-cohort.json'
      - 'src/smart-wallet-budget.mjs'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: goget-wallet-webhook-control
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full existing GOGET tests and new webhook security checks
        run: |
          node --check src/smart-wallet-webhook-worker.mjs
          node --check scripts/provision-smart-wallet-webhook.mjs
          node --test tests/*.test.mjs
      - name: Install pinned-compatible Wrangler
        run: npm install --no-audit --no-fund
      - name: Bind existing D1 without exposing its ID in commits
        env:
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('wrangler.smart-wallet.toml')
          ident=os.environ.get('CF_DATABASE_ID','')
          if len(ident)<16:raise SystemExit('D1_ID_MISSING')
          p.write_text(p.read_text().replace('REPLACE_WITH_YOUR_OWN_D1_DATABASE_ID',ident))
          PY
      - name: Create isolated idempotent D1 tables
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          from urllib.request import Request,urlopen
          account,database,token=[os.environ[k] for k in ('CF_ACCOUNT_ID','CF_DATABASE_ID','CF_D1_API_TOKEN')]
          if not all((account,database,token)):raise SystemExit('D1_CREDENTIALS_MISSING')
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{database}/query'
          sql='\n'.join(line for line in Path('sql/smart-wallet-webhook.sql').read_text().splitlines() if not line.lstrip().startswith('--'))
          stmts=[x.strip() for x in sql.split(';') if x.strip()]
          for s in stmts:
            req=Request(url,data=json.dumps({'sql':s,'params':[]}).encode(),
              headers={'authorization':'Bearer '+token,'content-type':'application/json'},method='POST')
            with urlopen(req,timeout=25) as r:resp=json.load(r)
            if not resp.get('success') or not resp.get('result',[{}])[0].get('success'):
              raise SystemExit('D1_SCHEMA_APPLY_FAILED')
          print('GOGET_SCHEMA_OK',len(stmts))
          PY
      - name: Deploy isolated non-trading Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.smart-wallet.toml
      - name: Verify own Helius credit budget before any subscription registration
        id: provider_budget
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: |
          node --input-type=module - <<'JS'
          import {appendFileSync} from 'node:fs';
          import {assessWebhookBudget} from './src/smart-wallet-budget.mjs';
          const required=n=>{const x=process.env[n];if(!x)throw Error('MISSING_'+n);return x;};
          const account=required('CF_ACCOUNT_ID'),db=required('CF_DATABASE_ID'),token=required('CF_D1_API_TOKEN');
          const endpoint='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account)+'/d1/database/'+encodeURIComponent(db)+'/query';
          async function query(sql,params){
            const r=await fetch(endpoint,{method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json'},
              body:JSON.stringify({sql,params}),signal:AbortSignal.timeout(12000)});
            if(!r.ok)throw Error('BUDGET_D1_HTTP_'+r.status);
            const data=await r.json();
            if(data?.success!==true||data?.result?.[0]?.success!==true)throw Error('BUDGET_D1_REJECTED');
            return data.result[0].results||[];
          }
          const start=new Date(Date.now()-3600000).toISOString(),day=new Date().toISOString().slice(0,10);
          const [hour,usage]=await Promise.all([
            query('SELECT COUNT(*) AS n FROM smart_wallet_webhook_events WHERE observed_at>=?',[start]),
            query('SELECT reserved FROM smart_wallet_webhook_budget WHERE day=?',[day])
          ]);
          const policy=assessWebhookBudget({lastHour:hour[0]?.n,dayAttempted:usage[0]?.reserved??0});
          if(policy.action==='UNKNOWN_DATA_MANUAL_REVIEW')throw Error('BUDGET_UNVERIFIED');
          const latch=await query("SELECT state FROM smart_wallet_webhook_control WHERE id='owned' LIMIT 1",[]);
          const armed=latch.length===1&&latch[0].state==='ARMED';
          const safe=policy.safe&&armed;
          if(!process.env.GITHUB_OUTPUT)throw Error('GITHUB_OUTPUT_MISSING');
          appendFileSync(process.env.GITHUB_OUTPUT,`safe=${safe}\n`);
          console.log('GOGET_HELIUS_DEPLOY_BUDGET_GATE',{action:policy.action,armed,
            reasons:[...policy.reasons,...(armed?[]:['PERSISTENT_SUSPENSION_OR_UNKNOWN'])]});
          JS
      - name: Respect existing Helius credit suspension after a code deployment
        if: steps.provider_budget.outputs.safe == 'false'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node scripts/provision-smart-wallet-webhook.mjs guard
      - name: Set isolated bearer token and activate Helius SWAP webhook
        if: steps.provider_budget.outputs.safe == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: node scripts/provision-smart-wallet-webhook.mjs sync
      - name: Confirm webhook listed after registration
        if: steps.provider_budget.outputs.safe == 'true'
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node scripts/provision-smart-wallet-webhook.mjs verify
      - name: Prove exact deployed webhook Worker revision using authenticated read-only readiness
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          node --input-type=module - <<'JS'
          import {createHmac} from 'node:crypto';
          const admin=process.env.ADMIN_TOKEN,helius=process.env.HELIUS_API_KEY;
          if(!admin||!helius)throw Error('READINESS_CREDENTIAL_UNAVAILABLE');
          const token=createHmac('sha256',admin).update('GOGET:WEBHOOK:BEARER:v1:').update(helius).digest('base64url');
          const url='https://goget-smart-wallet-hook.wessteven.workers.dev/ready';
          let verified=false;
          for(let i=0;i<6;i++){
            try{
              const r=await fetch(url,{headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(8000)});
              if(r.status===200){
                const p=await r.json();
                if(p?.build==='RAW_WAITUNTIL_2026_11_01_V2'&&p?.ready===true&&p?.tradeEligible===false){
                  verified=true;break;
                }
              }
            }catch{}
            if(i<5)await new Promise(resolve=>setTimeout(resolve,1800));
          }
          if(!verified)throw Error('GOGET_LIVE_WORKER_REVISION_UNVERIFIED');
          console.log('GOGET_LIVE_WORKER_REVISION_VERIFIED');
          JS
  cleanup:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check UTC pilot cutoff
        id: expiry
        shell: bash
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d '2026-11-08T00:00:00Z' +%s)" ]; then
            echo "expired=true" >> "$GITHUB_OUTPUT"
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard provider event-credit velocity before scheduled cleanup
        if: steps.expiry.outputs.expired == 'false'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node scripts/provision-smart-wallet-webhook.mjs guard
      - name: Delete only exact GOGET Helius webhook after cutoff
        if: steps.expiry.outputs.expired == 'true'
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node scripts/provision-smart-wallet-webhook.mjs cleanup
      - name: Disable this completed hourly cleanup schedule after successful removal
        if: steps.expiry.outputs.expired == 'true'
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/workflows/deploy-smart-wallet-webhook.yml/disable'
          req=Request(u,method='PUT',headers={
            'Authorization':'Bearer '+os.environ['GH_API_TOKEN'],
            'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          try:
            with urlopen(req,timeout=20) as res:print('GOGET_CLEANUP_WORKFLOW_DISABLED',res.status)
          except HTTPError as e:raise SystemExit('CLEANUP_DISABLED_FAILED_HTTP_'+str(e.code))
          PY
