name: GOGET Wallet Webhook — deploy and time-boxed cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-smart-wallet-webhook.yml'
      - 'src/smart-wallet-webhook-worker.mjs'
      - 'tests/smart-wallet-webhook.test.mjs'
      - 'scripts/provision-smart-wallet-webhook.mjs'
      - 'wrangler.smart-wallet.toml'
      - 'sql/smart-wallet-webhook.sql'
      - 'research/smart-wallet-webhook-cohort.json'
      - 'src/smart-wallet-budget.mjs'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: goget-wallet-webhook-control
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full existing GOGET tests and new webhook security checks
        run: |
          node --check src/smart-wallet-webhook-worker.mjs
          node --check scripts/provision-smart-wallet-webhook.mjs
          node --test tests/*.test.mjs
      - name: Install pinned-compatible Wrangler
        run: npm install --no-audit --no-fund
      - name: Bind existing D1 without exposing its ID in commits
        env:
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('wrangler.smart-wallet.toml')
          ident=os.environ.get('CF_DATABASE_ID','')
          if len(ident)<16:raise SystemExit('D1_ID_MISSING')
          p.write_text(p.read_text().replace('REPLACE_WITH_YOUR_OWN_D1_DATABASE_ID',ident))
          PY
      - name: Create isolated idempotent D1 tables
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          from urllib.request import Request,urlopen
          account,database,token=[os.environ[k] for k in ('CF_ACCOUNT_ID','CF_DATABASE_ID','CF_D1_API_TOKEN')]
          if not all((account,database,token)):raise SystemExit('D1_CREDENTIALS_MISSING')
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{database}/query'
          stmts=[x.strip() for x in Path('sql/smart-wallet-webhook.sql').read_text().split(';') if x.strip()]
          for s in stmts:
            req=Request(url,data=json.dumps({'sql':s,'params':[]}).encode(),
              headers={'authorization':'Bearer '+token,'content-type':'application/json'},method='POST')
            with urlopen(req,timeout=25) as r:resp=json.load(r)
            if not resp.get('success') or not resp.get('result',[{}])[0].get('success'):
              raise SystemExit('D1_SCHEMA_APPLY_FAILED')
          print('GOGET_SCHEMA_OK',len(stmts))
          PY
      - name: Deploy isolated non-trading Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.smart-wallet.toml
      - name: Set isolated bearer token and activate Helius SWAP webhook
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: node scripts/provision-smart-wallet-webhook.mjs sync
      - name: Confirm webhook listed after registration
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node scripts/provision-smart-wallet-webhook.mjs verify
  cleanup:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check UTC pilot cutoff
        id: expiry
        shell: bash
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d '2026-11-08T00:00:00Z' +%s)" ]; then
            echo "expired=true" >> "$GITHUB_OUTPUT"
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard provider event-credit velocity before scheduled cleanup
        if: steps.expiry.outputs.expired == 'false'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node scripts/provision-smart-wallet-webhook.mjs guard
      - name: Delete only exact GOGET Helius webhook after cutoff
        if: steps.expiry.outputs.expired == 'true'
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node scripts/provision-smart-wallet-webhook.mjs cleanup
      - name: Disable this completed hourly cleanup schedule after successful removal
        if: steps.expiry.outputs.expired == 'true'
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/workflows/deploy-smart-wallet-webhook.yml/disable'
          req=Request(u,method='PUT',headers={
            'Authorization':'Bearer '+os.environ['GH_API_TOKEN'],
            'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          try:
            with urlopen(req,timeout=20) as res:print('GOGET_CLEANUP_WORKFLOW_DISABLED',res.status)
          except HTTPError as e:raise SystemExit('CLEANUP_DISABLED_FAILED_HTTP_'+str(e.code))
          PY
