name: GOGET Verify Cloudflare Cron and Helius Normalization (read only)
on:
  push:
    branches: [main]
    paths:
      - 'src/goget-cron-evidence.mjs'
      - 'scripts/goget-cron-normalization-audit.mjs'
      - 'tests/goget-cron-evidence.test.mjs'
      - '.github/workflows/goget-cron-normalization-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test five-minute denominator and non-comparable source metrics
        run: |
          node --check src/goget-cron-evidence.mjs
          node --check scripts/goget-cron-normalization-audit.mjs
          node --test tests/goget-cron-evidence.test.mjs
      - name: Read exact D1 cron slots and delivery/normalization data
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: node scripts/goget-cron-normalization-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goget-cron-normalization-evidence
          path: goget-cron-normalization-evidence.json
          retention-days: 21
          if-no-files-found: warn
