name: Deploy BuyGuy Free Dashboard
# Release includes bounded, authenticated discovery-quality diagnostics.
# Deployment requires SQL, protocol-specific vault, canonical migration, historical-TX and dashboard regression tests to pass before release.
# Five-pool fast radar: additive sample table and SQLite DO; existing cron/paper unchanged.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dashboard.yml'
      - 'tests/history-read-budget.test.mjs'
      - 'src/viewer.mjs'
      - 'src/fast-radar.mjs'
      - 'src/helius-fast-quotes.mjs'
      - 'tests/fast-radar.test.mjs'
      - 'src/discovery-quality.mjs'
      - 'src/clean-slate.mjs'
      - 'tests/clean-slate.test.mjs'
      - 'tests/discovery-quality.test.mjs'
      - 'src/on-demand-audit.mjs'
      - 'src/watchlist.mjs'
      - 'src/auth-session.mjs'
      - 'src/light-scan.mjs'
      - 'src/dex-fallback.mjs'
      - 'src/paper-core.mjs'
      - 'src/paper-ops.mjs'
      - 'src/token-risk.mjs'
      - 'src/risk-ops.mjs'
      - 'src/green-gate.mjs'
      - 'src/green-probes.mjs'
      - 'src/pumpswap.mjs'
      - 'src/pump-migration.mjs'
      - 'src/pump-migration-tx.mjs'
      - 'src/raydium-cpmm.mjs'
      - 'src/pool-protocol.mjs'
      - 'src/program-authority.mjs'
      - 'src/holder-risk.mjs'
      - 'src/quote-route.mjs'
      - 'src/route-ops.mjs'
      - 'src/price-refresh.mjs'
      - 'src/token-tiers.mjs'
      - 'src/scheduled-research.mjs'
      - 'src/score-journal.mjs'
      - 'src/our-score-core.mjs'
      - 'src/retirement.mjs'
      - 'sql/schema.sql'
      - 'sql/fast-radar.sql'
      - 'scripts/prove-fast-radar.py'
      - 'wrangler.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deployment tool
        run: npm install --no-audit --no-fund
      - name: Test JavaScript and execute SQLite integration tests before deployment
        run: |
          node --check src/viewer.mjs
          node --check src/light-scan.mjs
          node --check src/score-journal.mjs
          node --check src/our-score-core.mjs
          node --test tests/*.test.mjs
      - name: Configure D1 binding locally, without committing identifiers
        env:
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('wrangler.toml')
          ident=os.environ.get('CF_DATABASE_ID','')
          if not ident:raise SystemExit('Configure CF_DATABASE_ID in Actions repository secrets first')
          p.write_text(p.read_text().replace('REPLACE_WITH_YOUR_OWN_D1_DATABASE_ID',ident))
          PY
      - name: Check deployment token is configured
        env:
          CF_DEPLOY_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
        run: |
          test -n "$CF_DEPLOY_API_TOKEN" || { echo "::error::Missing CF_DEPLOY_API_TOKEN secret"; exit 1; }
      - name: Confirm dashboard login secret before publishing
        env:
          DASHBOARD_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          test -n "$DASHBOARD_TOKEN" || { echo "::error::Missing ADMIN_TOKEN GitHub Actions secret. Create a long random password before deploying."; exit 1; }
      - name: Prepare additive fast-radar history schema
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: python scripts/prove-fast-radar.py --schema-only
      - name: Deploy dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Set private dashboard secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DASHBOARD_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          test -n "$DASHBOARD_TOKEN" || { echo "Missing ADMIN_TOKEN" >&2; exit 1; }
          printf %s "$DASHBOARD_TOKEN" | npx wrangler secret put ADMIN_TOKEN --name buyguy-free-radar
      - name: Configure optional private Helius RPC without printing credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          if [ -n "$HELIUS_API_KEY" ]; then
            printf 'https://mainnet.helius-rpc.com/?api-key=%s' "$HELIUS_API_KEY" | npx wrangler secret put HELIUS_RPC_URL --name buyguy-free-radar
            echo "Optional read-only Helius RPC configured without printing its key."
          else
            echo "No HELIUS_API_KEY GitHub secret; autonomous mint checks stay disabled."
          fi

      - name: Verify persistent D1 state using authenticated Cloudflare API
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,time
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          url='https://api.cloudflare.com/client/v4/accounts/{}/d1/database/{}/query'.format(os.environ['CF_ACCOUNT_ID'],os.environ['CF_DATABASE_ID'])
          # Verify table access with indexed, bounded reads. COUNT(*) over
          # growing history consumes unnecessary D1 Free daily row allowances.
          queries=[
            "SELECT asset_key FROM assets ORDER BY asset_key LIMIT 1",
            "SELECT id FROM observations ORDER BY id DESC LIMIT 1",
            "SELECT id,state FROM runs ORDER BY id DESC LIMIT 1",
            "SELECT id,started_at,completed_at,state,discovered,observed,provider_errors FROM runs WHERE id IN (501,503,509) ORDER BY id",
            "SELECT id,started_at,completed_at,state,discovered,observed,provider_errors FROM runs ORDER BY id DESC LIMIT 12",
            "SELECT id,asset_key,seen_at,provider FROM observations ORDER BY id DESC LIMIT 5",
            "WITH recent AS (SELECT id,asset_key,pool,provider,seen_at,liquidity,score,buys_m5,sells_m5 FROM observations ORDER BY id DESC LIMIT 400), tagged AS (SELECT o.*,r.id AS run_id,r.state AS run_state,CASE WHEN r.id IS NULL THEN 'UNATTRIBUTED' WHEN substr(r.started_at,1,19)=substr(o.seen_at,1,19) AND CAST(substr(r.started_at,15,2) AS INTEGER)%10=0 THEN 'SCHEDULED_OR_COLLISION' ELSE 'BROADER_OR_MANUAL' END AS path_hint FROM recent o LEFT JOIN runs r ON r.id=(SELECT x.id FROM runs x WHERE x.started_at=o.seen_at ORDER BY x.id DESC LIMIT 1)) SELECT path_hint,provider,COUNT(*) AS observations,COUNT(DISTINCT asset_key) AS distinct_mints,SUM(CASE WHEN score>=60 AND liquidity>=50000 THEN 1 ELSE 0 END) AS qualified_rows,SUM(CASE WHEN score<30 OR liquidity<15000 THEN 1 ELSE 0 END) AS low_value_rows FROM tagged GROUP BY path_hint,provider ORDER BY observations DESC",
            "WITH recent AS (SELECT id,asset_key,pool,provider,seen_at,liquidity,score,buys_m5,sells_m5 FROM observations ORDER BY id DESC LIMIT 400) SELECT provider,COUNT(*) AS rows,COUNT(DISTINCT asset_key) AS unique_mints,COUNT(DISTINCT asset_key||'|'||pool) AS mint_pool_pairs,SUM(CASE WHEN buys_m5>0 THEN 1 ELSE 0 END) AS rows_with_buys,SUM(CASE WHEN buys_m5=0 THEN 1 ELSE 0 END) AS zero_buy_rows,SUM(CASE WHEN score>=60 AND liquidity>=50000 THEN 1 ELSE 0 END) AS high_score_liquidity_rows FROM recent GROUP BY provider",
            "SELECT o.id,o.asset_key,o.pool,o.provider,o.seen_at,o.score,o.liquidity,o.buys_m5,o.sells_m5,a.pool_created,a.first_seen,a.updated_at FROM observations o JOIN assets a ON a.asset_key=o.asset_key ORDER BY o.id DESC LIMIT 12",
            "SELECT id,started_at,state,discovered,observed,provider_errors FROM runs ORDER BY id DESC LIMIT 12",
            "SELECT o.asset_key,COUNT(*) AS times_seen,COUNT(DISTINCT o.pool) AS pools,MAX(o.score) AS peak_score,MIN(o.seen_at) AS earliest,MAX(o.seen_at) AS latest FROM (SELECT asset_key,pool,score,seen_at FROM observations ORDER BY id DESC LIMIT 400) o GROUP BY o.asset_key HAVING COUNT(*)>=3 ORDER BY times_seen DESC LIMIT 10",
            "SELECT provider,COUNT(*) AS rows,COUNT(DISTINCT asset_key) AS unique_assets,COUNT(DISTINCT pool) AS unique_pools,SUM(CASE WHEN score>=60 THEN 1 ELSE 0 END) AS score_60_plus,SUM(CASE WHEN liquidity>=50000 THEN 1 ELSE 0 END) AS liq_50k_plus,MIN(seen_at) AS first_seen,MAX(seen_at) AS last_seen FROM (SELECT asset_key,pool,provider,score,liquidity,seen_at FROM observations ORDER BY id DESC LIMIT 400) GROUP BY provider",
            "SELECT provider,asset_key,COUNT(*) AS repeated,MIN(seen_at) AS first_seen,MAX(seen_at) AS last_seen,MAX(score) AS max_score FROM (SELECT asset_key,provider,seen_at,score FROM observations ORDER BY id DESC LIMIT 400) GROUP BY provider,asset_key ORDER BY repeated DESC LIMIT 12",
            "SELECT provider,COUNT(*) AS observations,SUM(CASE WHEN score<30 THEN 1 ELSE 0 END) AS score_below_30,SUM(CASE WHEN score>=60 THEN 1 ELSE 0 END) AS score_60_plus FROM (SELECT provider,score FROM observations ORDER BY id DESC LIMIT 400) GROUP BY provider",
            "SELECT id,asset_key,pool,provider,seen_at,price,liquidity,buys_m5,sells_m5,score FROM observations ORDER BY id DESC LIMIT 12",
            "SELECT asset_key,chain,address,symbol,pool,provider,score,liquidity,market_cap,updated_at,status,risk_status FROM assets WHERE asset_key IN (SELECT asset_key FROM observations ORDER BY id DESC LIMIT 12) LIMIT 12",
            "SELECT id,started_at,state,discovered,observed,provider_errors FROM runs ORDER BY id DESC LIMIT 16",
            "SELECT id,at,kind FROM research_events ORDER BY id DESC LIMIT 6",
            "SELECT name,expires_at,token FROM leases WHERE name IN ('discovery-provider:gecko','discovery-provider:dex') ORDER BY name",
            "SELECT id,started_at,completed_at,state,discovered,observed,provider_errors FROM runs WHERE julianday(started_at)>=julianday('2026-10-22T09:00:00Z') ORDER BY id DESC LIMIT 24",
            "SELECT id,started_at,state,discovered,observed,provider_errors FROM runs WHERE julianday(started_at)>=julianday('2026-10-22T10:10:00Z') ORDER BY id DESC LIMIT 28",
            "SELECT state,COUNT(*) AS scans FROM runs WHERE julianday(started_at)>=julianday('2026-10-22T10:10:00Z') AND julianday(started_at)<julianday('2026-10-22T20:00:00Z') GROUP BY state",
            "SELECT COUNT(*) AS direct_http_429 FROM runs WHERE julianday(started_at)>=julianday('2026-10-22T10:10:00Z') AND provider_errors LIKE '%HTTP 429%'",
            "SELECT COUNT(*) AS cooldown_skips FROM runs WHERE julianday(started_at)>=julianday('2026-10-22T10:10:00Z') AND provider_errors LIKE '%DISCOVERY_PROVIDERS_COOLDOWN%'",
            "SELECT MAX(seen_at) AS latest_observation,COUNT(*) AS observations FROM observations WHERE julianday(seen_at)>=julianday('2026-10-22T10:10:00Z')",
            "SELECT MAX(at) AS latest_research_event,COUNT(*) AS research_events FROM research_events WHERE julianday(at)>=julianday('2026-10-22T10:10:00Z')",
            "SELECT id,at,kind FROM research_events WHERE julianday(at)>=julianday('2026-10-22T09:00:00Z') ORDER BY id DESC LIMIT 12",
            "SELECT id,started_at,state,discovered,observed,provider_errors FROM runs ORDER BY id DESC LIMIT 16",
            "SELECT id,seen_at,provider FROM observations ORDER BY id DESC LIMIT 8",
            "SELECT id,at,kind FROM research_events ORDER BY id DESC LIMIT 8",
            "SELECT state,COUNT(*) AS scans,SUM(discovered) AS discovered,SUM(observed) AS observed FROM runs WHERE julianday(started_at)>=julianday('now','-1 day') GROUP BY state ORDER BY scans DESC",
            "SELECT COUNT(*) AS total,MIN(started_at) AS oldest,MAX(started_at) AS newest FROM runs WHERE julianday(started_at)>=julianday('now','-1 day')",
            "SELECT provider,COUNT(*) AS observations FROM observations WHERE julianday(seen_at)>=julianday('now','-1 day') GROUP BY provider ORDER BY observations DESC",
            "SELECT COUNT(*) AS gecko_429 FROM runs WHERE julianday(started_at)>=julianday('now','-1 day') AND provider_errors LIKE '%GeckoTerminal HTTP 429%'",
            "SELECT COUNT(*) AS dex_429 FROM runs WHERE julianday(started_at)>=julianday('now','-1 day') AND provider_errors LIKE '%DEX Screener%HTTP 429%'",
            "SELECT kind,COUNT(*) AS events FROM research_events WHERE julianday(at)>=julianday('now','-1 day') GROUP BY kind ORDER BY events DESC LIMIT 12",
            "SELECT starting_cash,cash,realised FROM paper_account WHERE account='buyguy-v3'",
            "SELECT id FROM paper_trades ORDER BY id DESC LIMIT 1"
          ]
          for sql in queries:
            req=Request(url,json.dumps({'sql':sql,'params':[]}).encode(),{'authorization':'Bearer '+os.environ['CF_D1_API_TOKEN'],'content-type':'application/json','accept':'application/json'})
            for attempt in range(1,4):
              try:
                with urlopen(req,timeout=25) as res:data=json.load(res)
              except HTTPError as exc:
                # No secrets or headers are printed, just API-supplied error messages.
                try:
                  raw=json.loads(exc.read(4096).decode())
                  errors=[str(e.get('message','unknown'))[:180] for e in raw.get('errors',[])]
                except (ValueError,UnicodeError):
                  errors=['Cloudflare API returned a non-JSON error']
                print('D1 verification HTTP',exc.code,'query',sql,'attempt',attempt,'errors',errors)
                if attempt<3 and exc.code in (400,429,500,502,503,504):
                  time.sleep(attempt*2);continue
                raise SystemExit('D1 verification blocked: HTTP '+str(exc.code))
              if not data.get('success') or not data.get('result') or not data['result'][0].get('success'):
                errors=[str(e.get('message','unknown'))[:180] for e in data.get('errors',[])]
                print('D1 verification response failure for',sql,errors)
                raise SystemExit('D1 verification query failed')
              print('D1',sql,':',json.dumps(data['result'][0].get('results',[]))[:3000])
              break
          PY
      - name: Test external dashboard reachability (Cloudflare 1010 tolerant)
        env:
          DASHBOARD_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import json,os
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          base='https://buyguy-free-radar.wessteven.workers.dev'
          def req(path,secret=None):
            h={'accept':'application/json'}
            if secret: h['authorization']='Bearer '+secret
            try:
              with urlopen(Request(base+path,headers=h),timeout=20) as r:return r.status,r.read(4096).decode()
            except HTTPError as e:return e.code,e.read(4096).decode()
          try:
            code,body=req('/health')
          except (URLError,TimeoutError) as e:
            print('::warning::Public dashboard network reachability not verified:',type(e).__name__)
          else:
            if code==200 and json.loads(body).get('server')=='online':
              anonymous,_=req('/api/status')
              authorized,payload=req('/api/status',os.environ['DASHBOARD_TOKEN'])
              if anonymous!=401 or authorized!=200:
                raise SystemExit('Worker returned response but API authentication/D1 binding failed: '+str((anonymous,authorized)))
              data=json.loads(payload)
              assert data.get('wallet') is not None and isinstance(data.get('assets'),list)
              print('PASS: public /health, private API denial, authenticated D1 dashboard')
            elif code==403 and ('1010' in body or 'Access denied' in body):
              print('::warning::Cloudflare Error 1010 blocks automated GitHub runner; user-browser access remains unverified. The Worker and D1 deployment steps succeeded.')
            else:
              raise SystemExit('Unexpected public dashboard HTTP '+str(code)+': '+repr(body[:200]))
          PY

      - name: Activate and prove five-pool fast radar
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: python scripts/prove-fast-radar.py --via-d1 --helius
