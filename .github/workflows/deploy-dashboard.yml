name: Deploy BuyGuy Free Dashboard
on:
  push:
    paths:
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deployment tool
        run: npm install --no-audit --no-fund
      - name: Configure D1 binding locally, without committing identifiers
        env:
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('wrangler.toml')
          ident=os.environ.get('CF_DATABASE_ID','')
          if not ident:raise SystemExit('Configure CF_DATABASE_ID in Actions repository secrets first')
          p.write_text(p.read_text().replace('REPLACE_WITH_YOUR_OWN_D1_DATABASE_ID',ident))
          PY
      - name: Check deployment token is configured
        env:
          CF_DEPLOY_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
        run: |
          test -n "$CF_DEPLOY_API_TOKEN" || { echo "::error::Missing CF_DEPLOY_API_TOKEN secret"; exit 1; }
      - name: Confirm dashboard login secret before publishing
        env:
          DASHBOARD_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          test -n "$DASHBOARD_TOKEN" || { echo "::error::Missing ADMIN_TOKEN GitHub Actions secret. Create a long random password before deploying."; exit 1; }
      - name: Deploy dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Set private dashboard secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DASHBOARD_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          test -n "$DASHBOARD_TOKEN" || { echo "Missing ADMIN_TOKEN" >&2; exit 1; }
          printf %s "$DASHBOARD_TOKEN" | npx wrangler secret put ADMIN_TOKEN --name buyguy-free-radar

      - name: Smoke-test deployed dashboard and protected D1 data
        env:
          DASHBOARD_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          base='https://buyguy-free-radar.wessteven.workers.dev'
          def probe(path, token=None):
              h={'Accept':'application/json'}
              if token: h['Authorization']='Bearer '+token
              req=Request(base+path,headers=h)
              try:
                  with urlopen(req,timeout=15) as r:
                      return r.status, r.read(262144).decode()
              except HTTPError as e:
                  return e.code, e.read(4096).decode()
          last=None
          for i in range(10):
              try:
                  code, body=probe('/health')
                  if code==200:
                      assert json.loads(body).get('server')=='online'
                      break
                  last='health returned HTTP '+str(code)
              except Exception as e: last=type(e).__name__
              time.sleep(8)
          else: raise SystemExit('Dashboard unavailable: '+str(last))
          code,_=probe('/api/status')
          assert code==401,'Unauthenticated API was not denied'
          code,body=probe('/api/status',os.environ['DASHBOARD_TOKEN'])
          if code!=200: raise SystemExit('Authenticated API returned HTTP '+str(code)+'; check D1 binding')
          data=json.loads(body)
          assert isinstance(data.get('assets'),list),'Assets table unavailable'
          assert isinstance(data.get('runs'),list),'Scan history unavailable'
          assert data.get('wallet') is not None,'Paper-wallet baseline unavailable'
          print('Dashboard health=200, anonymous API=401, authenticated API=200')
          print('Live D1 records: assets='+str(len(data['assets']))+', scans='+str(len(data['runs'])))
          print('Paper account installed; trades remain disabled.')
          PY
