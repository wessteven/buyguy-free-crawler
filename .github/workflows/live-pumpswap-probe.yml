name: Verify Real PumpSwap Pool
# Validates the canonical Token-2022 LP mint and both token vaults with real Helius.
on:
  push:
    paths:
      - '.github/workflows/live-pumpswap-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check actual tracked pool and matched vaults without any trade
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import {inspectPoolProtocol} from './src/pool-protocol.mjs';
          const endpoint='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT_ID+
             '/d1/database/'+process.env.CF_DATABASE_ID+'/query';
          const response=await fetch(endpoint,{method:'POST',headers:{
            authorization:'Bearer '+process.env.CF_D1_API_TOKEN,
            'content-type':'application/json'
          },body:JSON.stringify({sql:"SELECT asset_key,address,pool,symbol FROM assets WHERE chain='solana' AND pool IS NOT NULL AND status IN ('ALIVE','STATIC') ORDER BY score DESC LIMIT 12",params:[]})});
          const d=await response.json();
          if(!d?.success||!d?.result?.[0]?.success)throw Error('D1 source unavailable');
          const rows=d.result[0].results||[];
          const rpc='https://mainnet.helius-rpc.com/?api-key='+process.env.HELIUS_API_KEY;
          let accepted=null,details=[];
          for(const a of rows){
            try{
              const p=await inspectPoolProtocol(a.pool,a.address,rpc);
              details.push({symbol:a.symbol,status:p.status,protocol:p.protocol||'UNSUPPORTED',vaultsVerified:p.vaultsVerified===true});
              if(p.protocol==='PUMPSWAP'){
                accepted={symbol:a.symbol,protocol:p.protocol,status:p.status,
                  vaultsVerified:p.vaultsVerified,lpLockVerified:p.lpLockVerified,
                  verifiedVaultCount:p.verifiedVaults?.length||0,
                  lpSupplyGapBps:p.lpSupplyGapBps??null,flags:p.flags,
                  lpDiagnostics:p.lpDiagnostics||null};
                break;
              }
            }catch(e){details.push({symbol:a.symbol,errorType:e?.name||'UnknownError'});}
          }
          console.log('REAL_POOL_SAMPLE',JSON.stringify(accepted));
          console.log('CHECKED_PROTOCOLS',JSON.stringify(details));
          if(!accepted||!accepted.vaultsVerified)
            throw Error('PumpSwap vault identity NOT verified against actual Helius on-chain accounts');
          if(accepted.lpLockVerified)throw Error('False positive liquidity lock result');
          console.log('RESULT VERIFIED_ACTUAL_PUMPSWAP_VAULTS_ONLY_NO_LP_LOCK_OR_TRADE');
          JS
