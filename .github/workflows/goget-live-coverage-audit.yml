name: GOGET Complete Live Source Coverage (12 Helius + 3 RPC, read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goget-live-coverage-audit.yml'
      - 'src/goget-live-source-coverage.mjs'
      - 'scripts/goget-live-coverage-audit.mjs'
      - 'tests/goget-live-source-coverage.test.mjs'
      - 'research/smart-wallet-webhook-cohort.json'
      - 'wrangler.smart-wallet.toml'
  pull_request:
    paths:
      - '.github/workflows/goget-live-coverage-audit.yml'
      - 'src/goget-live-source-coverage.mjs'
      - 'scripts/goget-live-coverage-audit.mjs'
      - 'tests/goget-live-source-coverage.test.mjs'
      - 'research/smart-wallet-webhook-cohort.json'
      - 'wrangler.smart-wallet.toml'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goget-read-only-full-roster-audit
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check strict 12-wallet census and failure semantics
        run: |
          node --check src/goget-live-source-coverage.mjs
          node --check scripts/goget-live-coverage-audit.mjs
          node --test tests/goget-live-source-coverage.test.mjs
  audit:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify EXACT live Helius provider subscription cohort, without mutation
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node scripts/provision-smart-wallet-webhook.mjs verify
      - name: Audit all 12 webhook wallets and all 3 RPC cursor states, D1 read only
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: node scripts/goget-live-coverage-audit.mjs
      - name: Save bounded audit evidence even when provider fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goget-complete-live-source-audit
          path: goget-live-source-coverage-audit.json
          retention-days: 21
          if-no-files-found: warn
