name: GOGET Historical Gap Quality Ledger (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goget-historical-gap-ledger.yml'
      - 'scripts/goget-historical-gap-ledger.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goget-historical-gap-quality-ledger
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check bounded read-only ledger
        run: node --check scripts/goget-historical-gap-ledger.mjs
      - name: Verify current historical price, pool and ratio reconciliation
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: node scripts/goget-historical-gap-ledger.mjs
      - name: Preserve source coverage and unknowns
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goget-historical-gap-ledger
          path: goget-historical-gap-ledger.json
          retention-days: 21
          if-no-files-found: warn
