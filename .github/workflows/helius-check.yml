name: Verify private Helius RPC
on:
  push:
    paths:
      - '.github/workflows/helius-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  helius:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate Helius mainnet read-only authentication (never print secret)
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          python - <<'PY'
          import json,os,sys
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          key=os.environ.get('HELIUS_API_KEY','')
          if not key:
            print('::error::HELIUS_API_KEY secret is missing')
            sys.exit(1)
          endpoint='https://mainnet.helius-rpc.com/?api-key='+key
          req=Request(endpoint,data=json.dumps({
            'jsonrpc':'2.0','id':1,'method':'getAccountInfo',
            'params':['So11111111111111111111111111111111111111112',
            {'encoding':'jsonParsed','commitment':'confirmed'}]}).encode(),
            headers={'content-type':'application/json','accept':'application/json'},method='POST')
          try:
            with urlopen(req,timeout=20) as response:
              status=response.status
              payload=json.load(response)
          except HTTPError as ex:
            print('::error::Helius RPC returned HTTP '+str(ex.code)+'; credential or plan check needed')
            sys.exit(1)
          except (URLError,TimeoutError) as ex:
            print('::error::Helius RPC network failed: '+type(ex).__name__)
            sys.exit(1)
          except Exception as ex:
            print('::error::Helius RPC returned unexpected response: '+type(ex).__name__)
            sys.exit(1)
          if 'error' in payload:
            print('::error::Helius RPC JSON-RPC error code: '+str(payload['error'].get('code','unknown')))
            sys.exit(1)
          value=payload.get('result',{}).get('value')
          if status!=200 or not value or value.get('owner')!='TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA':
            print('::error::Helius RPC replied but canonical SOL mint was not verified')
            sys.exit(1)
          print('PASS: Helius authenticated read-only mainnet RPC responds with correct canonical SOL mint owner')
          print('No API key, private wallet balance, or wallet credential was displayed.')
          PY
