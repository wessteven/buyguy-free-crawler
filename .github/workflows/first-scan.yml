name: BuyGuy First Connection and Live Scan
on:
  push:
    paths:
      - '.github/workflows/first-scan.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: buyguy-free-shared-ledger
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check crawler logic
        run: python -m unittest discover -s tests -v
      - name: Check Cloudflare environment
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: |
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CF_ACCOUNT_ID secret"; exit 1; }
          test -n "$CF_DATABASE_ID" || { echo "::error::Missing CF_DATABASE_ID secret"; exit 1; }
          test -n "$CF_D1_API_TOKEN" || { echo "::error::Missing CF_D1_API_TOKEN secret"; exit 1; }
          echo "Required secrets are present (contents withheld)."
      - name: Initialize D1 and experimental paper account
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: python src/engine.py --init
      - name: Run first live discovery and journal scan
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: python src/engine.py
