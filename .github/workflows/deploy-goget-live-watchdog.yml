name: GOGET Live Source Cloudflare Watchdog — 5m D1-only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-goget-live-watchdog.yml'
      - 'src/goget-live-source-watchdog*.mjs'
      - 'scripts/verify-goget-live-watchdog.mjs'
      - 'sql/goget-live-source-watchdog.sql'
      - 'wrangler.live-watchdog.toml'
      - 'tests/goget-live-source-watchdog.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goget-live-source-watchdog-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce standalone source and all existing GOGET regression gates
        run: |
          node --check src/goget-live-source-watchdog.mjs
          node --check src/goget-live-source-watchdog-worker.mjs
          node --check scripts/verify-goget-live-watchdog.mjs
          node --test tests/*.test.mjs
      - name: Install existing Wrangler dependency
        run: npm install --no-audit --no-fund
      - name: Inject existing D1 binding without committing account identifier
        env:
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          ident=os.environ.get('CF_DATABASE_ID','')
          if len(ident)<16:raise SystemExit('WATCHDOG_D1_ID_UNAVAILABLE')
          p=Path('wrangler.live-watchdog.toml')
          p.write_text(p.read_text().replace('REPLACE_WITH_YOUR_OWN_D1_DATABASE_ID',ident))
          PY
      - name: Add independent, idempotent watchdog D1 ledger only
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: |
          python - <<'PY'
          import json,os
          from urllib.request import Request,urlopen
          from pathlib import Path
          a,d,t=[os.environ[k] for k in ('CF_ACCOUNT_ID','CF_DATABASE_ID','CF_D1_API_TOKEN')]
          url=f'https://api.cloudflare.com/client/v4/accounts/{a}/d1/database/{d}/query'
          statements=[s.strip() for s in Path('sql/goget-live-source-watchdog.sql').read_text().split(';') if s.strip() and not s.strip().startswith('--')]
          if not statements:raise SystemExit('WATCHDOG_SCHEMA_EMPTY')
          for stmt in statements:
            req=Request(url,data=json.dumps({'sql':stmt,'params':[]}).encode(),method='POST',
              headers={'authorization':'Bearer '+t,'content-type':'application/json'})
            with urlopen(req,timeout=15) as r:body=json.load(r)
            if body.get('success') is not True or body.get('result',[{}])[0].get('success') is not True:
              raise SystemExit('WATCHDOG_SCHEMA_FAILED')
          print('WATCHDOG_SCHEMA_IDEMPOTENT',len(statements))
          PY
      - name: Deploy independent five-minute D1-only cron Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.live-watchdog.toml
      - name: Install purpose-separated manual verification secret
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node -e 'const {createHmac}=require("node:crypto");const s=process.env.ADMIN_TOKEN;if(!s||s.length<24)process.exit(1);process.stdout.write(createHmac("sha256",s).update("GOGET:SOURCE_WATCHDOG:RUN:v1").digest("base64url"))' | npx wrangler secret put WATCHDOG_CONTROL_TOKEN --config wrangler.live-watchdog.toml
      - name: Verify exact production build and persist one bounded manual heartbeat
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: node scripts/verify-goget-live-watchdog.mjs
