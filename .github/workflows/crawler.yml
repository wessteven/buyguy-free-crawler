name: BuyGuy Free Crawler
on:
  schedule:
    - cron: '8 * * * *'
  push:
    paths:
      - '.github/workflows/crawler.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Run stage (init or scan)'
        type: choice
        required: true
        options: [init, scan]
        default: scan
# Hourly secondary fallback only: Cloudflare Worker remains the primary */10-minute
# scanner. Avoid running two independent 10-minute readers against D1 Free quotas.
# GitHub cron best-effort; this workflow remains manually dispatchable.
# Source and database verified; GeckoTerminal secondary-source scanner is now tested in CI.
# A workflow edit can trigger a validation scan; automatic GitHub backup is hourly.
permissions:
  contents: read
concurrency:
  group: buyguy-free-shared-ledger
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check setup and run crawler
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          BLOCKSCOUT_PRO_API_KEY: ${{ secrets.BLOCKSCOUT_PRO_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'scan' }}
        run: |
          test -f src/engine.py || { echo "Crawler source is not installed"; exit 1; }
          test -n "$CF_ACCOUNT_ID" && test -n "$CF_DATABASE_ID" && test -n "$CF_D1_API_TOKEN" || { echo "Required D1 secrets are missing"; exit 1; }
          if [ "$ACTION" = init ]; then
            python src/engine.py --init
          elif [ "$ACTION" = scan ]; then
            python src/engine.py
          else
            exit 2
          fi

  night_efficacy:
    if: github.event_name != 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only GOGET overnight evidence
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: node scripts/smart-wallet-overnight-efficacy.mjs
      - name: Archive overnight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goget-smart-wallet-overnight-efficacy
          path: smart-wallet-overnight-efficacy.json
          retention-days: 7
          if-no-files-found: warn
