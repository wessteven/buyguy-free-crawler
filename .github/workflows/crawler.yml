name: BuyGuy Free Crawler
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Run stage (init or scan)'
        type: choice
        required: true
        options: [init, scan]
        default: scan
# Best-effort ten-minute scans. GitHub Actions may delay or skip scheduled runs.
# Source, D1 setup and first authenticated live scan were verified before enabling.
permissions:
  contents: read
concurrency:
  group: buyguy-free-shared-ledger
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check setup and run crawler
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          BLOCKSCOUT_PRO_API_KEY: ${{ secrets.BLOCKSCOUT_PRO_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          ACTION: ${{ github.event_name == 'schedule' && 'scan' || inputs.action }}
        run: |
          test -f src/engine.py || { echo "Crawler source is not installed"; exit 1; }
          test -n "$CF_ACCOUNT_ID" && test -n "$CF_DATABASE_ID" && test -n "$CF_D1_API_TOKEN" || { echo "Required D1 secrets are missing"; exit 1; }
          if [ "$ACTION" = init ]; then
            python src/engine.py --init
          elif [ "$ACTION" = scan ]; then
            python src/engine.py
          else
            exit 2
          fi
