name: GOGET Six-Agent Free Harness (paper-only research)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goget-six-agent-research-only
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify six-agent harness, contracts and zero-trade guardrails
        run: |
          node --check scripts/goget-six-agent-replay.mjs
          node --test tests/goget-six-agent-harness.test.mjs tests/goget-six-agent-batching.test.mjs
          node --test tests/smart-wallet-webhook.test.mjs
      - name: Process bounded unreviewed D1 webhook evidence into a separate research ledger
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: node scripts/goget-six-agent-replay.mjs
      - name: Preserve the independently replayable six-agent trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goget-six-agent-reviews
          path: goget-six-agent-reviews.json
          if-no-files-found: warn
          retention-days: 7
