name: Fast radar regression tests
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'sql/**', '.github/workflows/fast-radar-tests.yml']
  push:
    branches: ['feat/fast-radar-30s']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check src/viewer.mjs && node --check src/fast-radar.mjs
      - run: node --test tests/*.test.mjs
      - run: python -m unittest discover -s tests -v
