name: GOGET Smart Wallet Live Watch (paper-only research)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smart-wallet-live.yml'
      - 'src/smart-wallet-live-probe.mjs'
      - 'scripts/smart-wallet-live-probe.mjs'
      - 'research/smart-wallet-live-cohort.json'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goget-smart-wallet-watch-only
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SMART_WALLET_LIVE_ENABLED: 'true'
      SMART_WALLET_LIVE_END_UTC: '2026-11-02T00:00:00Z'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate watch-only source and regression tests
        run: |
          node --check scripts/smart-wallet-live-probe.mjs
          node --test tests/smart-wallet-live-probe.test.mjs tests/smart-wallet-helius.test.mjs tests/smart-wallet-lab.test.mjs
      - name: Collect bounded Helius wallet evidence and save only to isolated D1 tables
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: node scripts/smart-wallet-live-probe.mjs
      - name: Preserve bounded execution evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-wallet-live-evidence
          path: smart-wallet-live-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify actual incoming Helius webhook evidence in D1 (read-only)
        if: always()
        continue-on-error: true
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: node scripts/smart-wallet-webhook-evidence.mjs
