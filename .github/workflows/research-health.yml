name: BuyGuy Research Health Report
on:
  push:
    paths:
      - '.github/workflows/research-health.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Query live D1 research status (read-only)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: |
          python - <<'PY'
          import json,os
          from urllib.request import Request,urlopen
          url='https://api.cloudflare.com/client/v4/accounts/{}/d1/database/{}/query'.format(os.environ['CF_ACCOUNT_ID'],os.environ['CF_DATABASE_ID'])
          def q(sql):
            request=Request(url,json.dumps({'sql':sql,'params':[]}).encode(),
              {'authorization':'Bearer '+os.environ['CF_D1_API_TOKEN'],'content-type':'application/json'})
            with urlopen(request,timeout=30) as r: resp=json.load(r)
            assert resp.get('success') and resp['result'][0]['success']
            return resp['result'][0]['results']
          print('SCAN TOTALS:',q("SELECT state,COUNT(*) AS n FROM runs GROUP BY state"))
          print('RECENT SCANS:',q("SELECT started_at,state,discovered,observed,provider_errors FROM runs ORDER BY id DESC LIMIT 8"))
          print('SOURCE COUNTS:',q("SELECT provider,chain,COUNT(*) AS n FROM assets GROUP BY provider,chain ORDER BY n DESC"))
          print('STATE COUNTS:',q("SELECT status,chain,COUNT(*) AS n FROM assets GROUP BY status,chain"))
          print('OBSERVATIONS:',q("SELECT COUNT(*) AS n,MAX(seen_at) AS latest FROM observations"))
          print('QUOTE PROVIDER COUNTS:',q("SELECT provider,COUNT(*) AS n,MAX(seen_at) AS latest FROM observations GROUP BY provider"))
          print('FRESH TOKEN QUOTES:',q("SELECT chain,status,COUNT(*) AS n FROM assets WHERE last_seen>=strftime('%Y-%m-%dT%H:%M:%SZ','now','-20 minutes') GROUP BY chain,status"))
          print('LATEST ACTIVE ASSETS:',q("SELECT symbol,chain,score,liquidity,market_cap,risk_status,pool_created,last_seen FROM assets WHERE last_seen>=strftime('%Y-%m-%dT%H:%M:%SZ','now','-20 minutes') ORDER BY score DESC LIMIT 10"))
          print('TOP UNVERIFIED LEADS:')
          for item in q("SELECT symbol,chain,address,score,liquidity,market_cap,buys_m5,sells_m5,status,risk_status,provider FROM assets WHERE status IN ('ALIVE','STATIC') ORDER BY score DESC LIMIT 12"):
            print(json.dumps(item,separators=(',',':')))
          print('ACCOUNT:',q("SELECT starting_cash,cash,realised FROM paper_account WHERE account='buyguy-v3'"))
          print('RISK REVIEW STATES:',q("SELECT risk_status,chain,COUNT(*) AS n FROM assets GROUP BY risk_status,chain ORDER BY n DESC"))
          print('MINT REVIEW EVENTS:',q("SELECT COUNT(*) AS n,MAX(at) AS latest FROM research_events WHERE kind='MINT_AUTHORITY_REVIEW'"))
          print('MINT REVIEW DETAILS:',q("SELECT asset_key,note FROM research_events WHERE kind='MINT_AUTHORITY_REVIEW' ORDER BY id DESC LIMIT 8"))
          print('RECENT MINT FLAGS:',q("SELECT a.symbol,a.chain,a.risk_status,a.risk_note FROM assets a WHERE risk_status != 'UNVERIFIED' ORDER BY updated_at DESC LIMIT 6"))
          print('LATEST SCREENING COUNTS:',q("SELECT kind,COUNT(*) AS n,MAX(at) AS latest FROM research_events GROUP BY kind ORDER BY latest DESC"))
          print('RECENT ROUTE EVIDENCE:',q("SELECT at,asset_key,note FROM research_events WHERE kind='ROUNDTRIP_QUOTE' ORDER BY id DESC LIMIT 5"))
          print('PAPER QUALIFIED:',q("SELECT COUNT(*) AS n FROM assets WHERE risk_status='PAPER_ELIGIBLE'"))
          print('PAPER FILLS:',q("SELECT COUNT(*) AS n FROM paper_trades"))
          PY
      - name: Classify current HOT / NOT and quote coverage using same deployed rules
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import {tokenTier,countCoverage,selectRefreshTargets} from './src/token-tiers.mjs';
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT_ID+
            '/d1/database/'+process.env.CF_DATABASE_ID+'/query';
          const query="SELECT asset_key,chain,address,symbol,status,pinned,score,liquidity,price,buys_m5,sells_m5,change_h1,last_seen,risk_status FROM assets WHERE status IN ('ALIVE','STATIC','DEAD') ORDER BY asset_key LIMIT 500";
          const response=await fetch(base,{method:'POST',headers:{
            authorization:'Bearer '+process.env.CF_D1_API_TOKEN,'content-type':'application/json'},
            body:JSON.stringify({sql:query,params:[]})});
          const data=await response.json();
          if(!data?.success||!data?.result?.[0]?.success)throw Error('D1 query unavailable');
          const rows=data.result[0].results||[];
          const now=Date.now(),coverage=countCoverage(rows,now);
          const hot=rows.filter(x=>tokenTier(x,now).tier==='HOT')
            .sort((a,b)=>b.score-a.score).slice(0,12)
            .map(x=>({symbol:x.symbol,score:x.score,ageMins:tokenTier(x,now).ageMinutes,liq:x.liquidity}));
          const cold=rows.filter(x=>tokenTier(x,now).tier==='NOT');
          const reasons={};
          for(const r of cold){const k=tokenTier(r,now).reason;reasons[k]=(reasons[k]||0)+1}
          console.log('LIVE_HOT_NOT_COVERAGE',JSON.stringify(coverage));
          console.log('LIVE_HOT_CANDIDATES',JSON.stringify(hot));
          console.log('LIVE_NOT_REASONS',JSON.stringify(reasons));
          console.log('10_MINUTE_REFRESH_CAPACITY',{default:20,max:25,quoteConfirmations:0});
          JS
