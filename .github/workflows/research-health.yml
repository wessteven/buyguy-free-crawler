name: BuyGuy Research Health Report
on:
  push:
    paths:
      - '.github/workflows/research-health.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query live D1 research status (read-only)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: |
          python - <<'PY'
          import json,os
          from urllib.request import Request,urlopen
          url='https://api.cloudflare.com/client/v4/accounts/{}/d1/database/{}/query'.format(os.environ['CF_ACCOUNT_ID'],os.environ['CF_DATABASE_ID'])
          def q(sql):
            request=Request(url,json.dumps({'sql':sql,'params':[]}).encode(),
              {'authorization':'Bearer '+os.environ['CF_D1_API_TOKEN'],'content-type':'application/json'})
            with urlopen(request,timeout=30) as r: resp=json.load(r)
            assert resp.get('success') and resp['result'][0]['success']
            return resp['result'][0]['results']
          print('SCAN TOTALS:',q("SELECT state,COUNT(*) AS n FROM runs GROUP BY state"))
          print('RECENT SCANS:',q("SELECT started_at,state,discovered,observed,provider_errors FROM runs ORDER BY id DESC LIMIT 8"))
          print('SOURCE COUNTS:',q("SELECT provider,chain,COUNT(*) AS n FROM assets GROUP BY provider,chain ORDER BY n DESC"))
          print('STATE COUNTS:',q("SELECT status,chain,COUNT(*) AS n FROM assets GROUP BY status,chain"))
          print('OBSERVATIONS:',q("SELECT COUNT(*) AS n,MAX(seen_at) AS latest FROM observations"))
          print('TOP UNVERIFIED LEADS:')
          for item in q("SELECT symbol,chain,address,score,liquidity,market_cap,buys_m5,sells_m5,status,risk_status,provider FROM assets WHERE status IN ('ALIVE','STATIC') ORDER BY score DESC LIMIT 12"):
            print(json.dumps(item,separators=(',',':')))
          print('ACCOUNT:',q("SELECT starting_cash,cash,realised FROM paper_account WHERE account='buyguy-v3'"))
          print('RISK REVIEW STATES:',q("SELECT risk_status,chain,COUNT(*) AS n FROM assets GROUP BY risk_status,chain ORDER BY n DESC"))
          print('MINT REVIEW EVENTS:',q("SELECT COUNT(*) AS n,MAX(at) AS latest FROM research_events WHERE kind='MINT_AUTHORITY_REVIEW'"))
          print('RECENT MINT FLAGS:',q("SELECT a.symbol,a.chain,a.risk_status,a.risk_note FROM assets a WHERE risk_status != 'UNVERIFIED' ORDER BY updated_at DESC LIMIT 6"))
          print('PAPER FILLS:',q("SELECT COUNT(*) AS n FROM paper_trades"))
          PY
