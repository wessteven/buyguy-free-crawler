name: GOGET event pilot provider-metered Durable Object usage — read only
on:
  push:
    branches: [main]
    paths:
      - 'scripts/goget-event-pilot-do-meter.mjs'
      - '.github/workflows/goget-event-pilot-do-meter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Query Cloudflare actual DO usage per named object; no writes or Helius calls
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DEPLOY_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
        run: |
          node --check scripts/goget-event-pilot-do-meter.mjs
          node scripts/goget-event-pilot-do-meter.mjs
