name: GOGET one-hour stream ACK and D1 quality proof — read only
on:
  push:
    branches: [main]
    paths:
      - 'scripts/goget-event-pilot-live-audit.mjs'
      - '.github/workflows/goget-event-pilot-live-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read live Worker subscription and D1 completeness; no RPC, no writes, no trades
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: |
          node --check scripts/goget-event-pilot-live-audit.mjs
          node scripts/goget-event-pilot-live-audit.mjs
