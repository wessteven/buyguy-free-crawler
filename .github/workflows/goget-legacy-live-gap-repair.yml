name: GOGET Three Legacy Live Cursor Gaps — bounded Helius replay
on:
  pull_request:
    paths:
      - '.github/workflows/goget-legacy-live-gap-repair.yml'
      - 'src/goget-legacy-live-gap-replay.mjs'
      - 'scripts/goget-legacy-live-gap-repair.mjs'
      - 'scripts/goget-legacy-live-gap-audit.mjs'
      - 'sql/goget-legacy-live-gap-replay.sql'
      - 'tests/goget-legacy-live-gap-replay.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/goget-legacy-live-gap-repair.yml'
      - 'src/goget-legacy-live-gap-replay.mjs'
      - 'scripts/goget-legacy-live-gap-repair.mjs'
      - 'scripts/goget-legacy-live-gap-audit.mjs'
      - 'sql/goget-legacy-live-gap-replay.sql'
      - 'tests/goget-legacy-live-gap-replay.test.mjs'
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goget-legacy-3-rpc-replay-budget-and-journal
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Regress all existing GOGET and other repository JS checks
        run: |
          node --check src/goget-legacy-live-gap-replay.mjs
          node --check scripts/goget-legacy-live-gap-repair.mjs
          node --check scripts/goget-legacy-live-gap-audit.mjs
          node --test tests/*.test.mjs
      - name: Replay schema is isolated and idempotent in SQLite
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3
          s=Path('sql/goget-legacy-live-gap-replay.sql').read_text()
          db=sqlite3.connect(':memory:')
          db.executescript(s);db.executescript(s)
          observed={row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          expected={'goget_legacy_rpc_replay_budget','goget_legacy_rpc_replay_journal',
           'goget_legacy_rpc_replay_signatures','goget_legacy_rpc_replay_runs'}
          assert expected<=observed
          assert not any(x.startswith('smart_wallet_') for x in observed)
          print('GOGET_LEGACY_REPLAY_SCHEMA_ISOLATED_FOUR_TABLES')
          PY
  recover:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify pilot UTC cutoff before using any secrets or source calls
        id: cutoff
        run: |
          if [ "$(date -u +%s)" -ge "1794096000" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "GOGET_LEGACY_REPLAY_STOPPED_2026_11_08_NO_CREDITS"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create ONLY isolated legacy replay tables in original D1 (idempotent)
        if: steps.cutoff.outputs.go == 'true'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          from urllib.request import Request,urlopen
          a,d,k=[os.environ[x] for x in ('CF_ACCOUNT_ID','CF_DATABASE_ID','CF_D1_API_TOKEN')]
          url=f'https://api.cloudflare.com/client/v4/accounts/{a}/d1/database/{d}/query'
          source='\n'.join(l for l in Path('sql/goget-legacy-live-gap-replay.sql').read_text().splitlines()
                           if not l.lstrip().startswith('--'))
          statements=[s.strip() for s in source.split(';') if s.strip()]
          if len(statements)!=5:raise SystemExit('LEGACY_SCHEMA_STATEMENTS_UNVERIFIED')
          for stmt in statements:
            if not stmt.startswith(('CREATE TABLE IF NOT EXISTS goget_legacy_rpc_replay_',
                                   'CREATE INDEX IF NOT EXISTS goget_legacy_rpc_replay_')):
              raise SystemExit('LEGACY_SCHEMA_TOUCHES_ORIGINAL_SOURCE')
            request=Request(url,data=json.dumps({'sql':stmt,'params':[]}).encode(),method='POST',
                headers={'authorization':'Bearer '+k,'content-type':'application/json'})
            with urlopen(request,timeout=19) as response:data=json.load(response)
            if data.get('success') is not True or data.get('result',[{}])[0].get('success') is not True:
              raise SystemExit('LEGACY_SCHEMA_D1_WRITE_UNVERIFIED')
          print('GOGET_LEGACY_REPLAY_D1_ISOLATED_FIVE_SCHEMA_STATEMENTS')
          PY
      - name: Recover bounded 3-wallet source histories with atomic shared 9000-credit cap
        if: steps.cutoff.outputs.go == 'true'
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: node scripts/goget-legacy-live-gap-repair.mjs
      - name: Independently reconcile exact signatures against all original source tables
        if: steps.cutoff.outputs.go == 'true'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: node scripts/goget-legacy-live-gap-audit.mjs
      - name: Preserve replay and audit evidence even on incomplete coverage or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goget-legacy-3-wallet-source-gap-evidence
          path: |
            goget-legacy-gap-repair-report.json
            goget-legacy-gap-identity-audit.json
          retention-days: 30
          if-no-files-found: warn
