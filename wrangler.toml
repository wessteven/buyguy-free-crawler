name = "buyguy-free-radar"
main = "src/viewer.mjs"
compatibility_date = "2026-10-18"
workers_dev = true
[[d1_databases]]
binding = "DB"
database_name = "buyguy-free-v3"
database_id = "REPLACE_WITH_YOUR_OWN_D1_DATABASE_ID"

# Cloudflare Workers Free: one lightweight, independent ten-minute Cron Trigger.
[triggers]
crons = ["*/10 * * * *"]

# Five-pool trial: SQLite Durable Objects work on Workers Free.
[[durable_objects.bindings]]
name = "FAST_RADAR"
class_name = "FastRadar"

[[migrations]]
tag = "fast-radar-v1"
new_sqlite_classes = ["FastRadar"]

[vars]
FAST_RADAR_ENABLED = "true"

FAST_RADAR_SOURCE = "helius"
