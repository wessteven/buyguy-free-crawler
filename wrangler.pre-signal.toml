name = "goget-pre-signal"
main = "src/goget-pre-signal-worker.mjs"
compatibility_date = "2026-10-18"
workers_dev = true
[[d1_databases]]
binding = "DB"
database_name = "buyguy-free-v3"
database_id = "REPLACE_WITH_YOUR_OWN_D1_DATABASE_ID"

[triggers]
crons = ["*/5 * * * *"]

[limits]
cpu_ms = 1000

[vars]
PRE_SIGNAL_ENABLED = "true"
