plugins { id 'com.android.application' }
android {
    namespace 'dev.whatsgood.pocketradar'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.whatsgood.pocketradar'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.8.0'
    }
    // The release keystore is injected by GitHub Actions at build time.
    // Never commit signing keys, passwords, or base64 keystores to this public repo.
    signingConfigs {
        pocketRelease {
            def keyFile = System.getenv('POCKET_RADAR_KEYSTORE_PATH')
            def password = System.getenv('POCKET_RADAR_SIGNING_PASSWORD')
            if (keyFile && password) {
                storeFile file(keyFile)
                storePassword password
                keyAlias 'pocket-radar'
                keyPassword password
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.pocketRelease
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
