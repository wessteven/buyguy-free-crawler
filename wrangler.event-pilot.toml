name = "goget-event-stream-pilot"
main = "src/goget-event-pilot-worker.mjs"
compatibility_date = "2026-10-18"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "buyguy-free-v3"
database_id = "REPLACE_WITH_YOUR_OWN_D1_DATABASE_ID"

[[durable_objects.bindings]]
name = "EVENT_PILOT"
class_name = "GogetEventPilot"

[[migrations]]
tag = "goget-event-stream-pilot-v1"
new_sqlite_classes = ["GogetEventPilot"]

[triggers]
crons = ["*/5 * * * *"]

[limits]
cpu_ms = 3000

[vars]
GOGET_EVENT_PILOT_ENABLED = "true"
